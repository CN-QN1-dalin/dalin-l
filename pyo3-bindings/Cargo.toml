[package]
name="dalin-pyo3"
# 从 workspace exclude（需本机 Python dev 库才能链接），故不能继承 workspace 属性。
# 版本号与 workspace 保持一致（3.0.0-dev），发版时同步更新。
version="3.0.0-dev"
edition="2024"

[lib]
name="dalin_pyo3"
path="src/lib.rs"
crate-type=["cdylib","lib"]

[dependencies]
dalin-compiler = { path = "../compiler" }
dalin-runtime = { path = "../runtime" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Dalin L 3.0 — CI/CD Pipeline
#
# 自动运行：cargo check → cargo test → cargo clippy → cargo fmt
# 多平台矩阵：Linux / macOS / Windows
# Rust 版本：stable / beta

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── 主检查流程 ─────────────────────────────────────────────────
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --exclude dalin-pyo3

      - name: cargo test
        run: cargo test --workspace --exclude dalin-pyo3

      - name: cargo clippy
        run: cargo clippy --workspace --exclude dalin-pyo3 -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all --check

  # ─── Feature flags 组合测试 ─────────────────────────────────────
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [default, llvm, full]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check with features "${{ matrix.features }}"
        run: cargo check --workspace --exclude dalin-pyo3 --features "${{ matrix.features }}"

  # ─── 基准测试（仅 Linux，仅 stable） ────────────────────────────
  bench:
    runs-on: ubuntu-latest
    needs: [check, features]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --workspace --exclude dalin-pyo3 2>&1 || true
        # 基准测试失败不阻断 CI（可能因环境差异波动）